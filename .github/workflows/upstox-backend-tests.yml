name: Upstox backend tests

on:
  pull_request:
    paths:
      - "backend/upstox-worker/**"
      - ".github/workflows/upstox-backend-tests.yml"
  push:
    branches:
      - "feature/upstox-backend-hardening"
    paths:
      - "backend/upstox-worker/**"
      - ".github/workflows/upstox-backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/upstox-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

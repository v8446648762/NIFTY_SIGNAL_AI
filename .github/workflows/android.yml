name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MGROW_KEYSTORE_PATH: ${{ runner.temp }}/mgrow-release.jks
      MGROW_KEYSTORE_PASSWORD: ${{ secrets.MGROW_KEYSTORE_PASSWORD }}
      MGROW_KEY_ALIAS: ${{ secrets.MGROW_KEY_ALIAS }}
      MGROW_KEY_PASSWORD: ${{ secrets.MGROW_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing secrets
        env:
          MGROW_KEYSTORE_BASE64: ${{ secrets.MGROW_KEYSTORE_BASE64 }}
        run: |
          test -n "$MGROW_KEYSTORE_BASE64" || (echo "Missing MGROW_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$MGROW_KEYSTORE_PASSWORD" || (echo "Missing MGROW_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$MGROW_KEY_ALIAS" || (echo "Missing MGROW_KEY_ALIAS secret" && exit 1)
          test -n "$MGROW_KEY_PASSWORD" || (echo "Missing MGROW_KEY_PASSWORD secret" && exit 1)
          printf '%s' "$MGROW_KEYSTORE_BASE64" | base64 --decode > "$MGROW_KEYSTORE_PATH"
          chmod 600 "$MGROW_KEYSTORE_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build signed release APK
        run: gradle :app:testDebugUnitTest :app:assembleRelease

      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MGrow-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

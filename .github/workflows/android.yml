name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/testing-lab-isolated
      - feature/advanced-ai-engine-v1
      - feature/testing-lab-advanced-ai-ui
      - feature/live-candles-indicators-smart-ai
      - feature/mgrow-build157-upstox-integration

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MGROW_KEYSTORE_PASSWORD: ${{ secrets.MGROW_KEYSTORE_PASSWORD }}
      MGROW_KEY_ALIAS: ${{ secrets.MGROW_KEY_ALIAS }}
      MGROW_KEY_PASSWORD: ${{ secrets.MGROW_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check whether permanent signing is configured
        id: signing
        env:
          MGROW_KEYSTORE_BASE64: ${{ secrets.MGROW_KEYSTORE_BASE64 }}
          MGROW_KEYSTORE_PATH: ${{ runner.temp }}/mgrow-release.jks
        run: |
          if [ -n "$MGROW_KEYSTORE_BASE64" ] && [ -n "$MGROW_KEYSTORE_PASSWORD" ] && [ -n "$MGROW_KEY_ALIAS" ] && [ -n "$MGROW_KEY_PASSWORD" ]; then
            printf '%s' "$MGROW_KEYSTORE_BASE64" | base64 --decode > "$MGROW_KEYSTORE_PATH"
            chmod 600 "$MGROW_KEYSTORE_PATH"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Permanent signing secrets are not configured; building a debug APK only."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Build permanently signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          MGROW_KEYSTORE_PATH: ${{ runner.temp }}/mgrow-release.jks
        run: gradle :app:assembleRelease

      - name: Generate debug APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MGrow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Generate release APK checksum
        if: steps.signing.outputs.ready == 'true'
        run: sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MGrow-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/upstox-worker
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        run: npm install

      - name: Build and test read-only Worker
        run: npm test

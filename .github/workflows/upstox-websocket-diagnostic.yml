name: Isolated Upstox WebSocket Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  websocket-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4

      - name: Run isolated Upstox V3 WebSocket test
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: node scripts/upstox-websocket-diagnostic.mjs
